services:
  - type: web
    name: lder-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OTARI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: EMAIL_API_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GUARDRAIL_SECRET
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: CLASSIFIER_MODEL
        value: lder-classifier
      - key: SUMMARY_MODEL
        value: lder-summary
      - key: ASSISTANT_MODEL
        value: lder-assistant
      - key: STT_MODEL
        value: whisper-large-v3
